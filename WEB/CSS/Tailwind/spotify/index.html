<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

    />

  <body>
    <!-- https://a10.gaanacdn.com/gn_img/artists/zLp36PvbrG/Lp36AR0KrG/size_l_1716815534.webp -->
    <nav class="h-[7vh] bg-black flex items-center justify-between">
      <section class="text-white text-4xl">
        <a href="#"><i class="fa-brands fa-spotify"></i></a></i>
      </section>
      <section class="flex text-white relative gap-[20px] left-[200px]">
        <article
          class="text-white bg-[#2a2a2a] text-2xl flex justify-center items-center rounded-full w-[50px] h-[50px]"
        >
          <i class="fa-solid fa-house"></i>
        </article>
        <article
          class="flex bg-[#2a2a2a] h-[6vh] w-[20vw] rounded-[50px] justify-between px-[20px] items-center"
        >
          <div><i class="fa-solid fa-magnifying-glass"></i></div>
          <div>
            <input
              type="text"
              class="w-[14vw] outline-none border-r-[1px] border-r-white"

          <div><i class="fa-regular fa-window-maximize"></i></div>
        </article>
      </section>
      <section class="text-white flex items-center gap-[20px]">
        <article
          class="flex items-center gap-[20px] border-r-[1px] border-r-white pr-[20px]"
        >
          <a href=""><div>Premium</div></a>
          <div>Support</div>
          <div>Download</div>
        </article>
        <article class="flex items-center gap-[20px]">
          <div><i class="fa-regular fa-circle-down"></i> Install App</div>
          <div>Sign up</div>
          <div>
            <button
              class="bg-white text-black rounded-full w-[130px] font-bold h-[6vh]"
            >
              Log in
            </button>
          </div>
        </article>
      </section>
    </nav>

    <main class="flex justify-around h-[84vh] bg-black items-center">
      <aside class="w-[22%] h-[84vh] rounded-[20px] bg-[#545252]"></aside>
      <section class="w-[77%] h-[84vh] rounded-[20px] bg-[#515050]"></section>
    </main>
    <footer class="flex justify-between p-[10px] h-[5vh]">
      <p class="w-[60%]">
        We and our partners use cookies to personalize your experience, to show
        you ads based on your interests, and for measurement and analytics
        purposes. By using our website and services, you agree to our use of
        cookies as described in our Cookie Policy.
      </p>
      <p>
        <i class="fa-solid fa-xmark"></i>
      </p>
    </footer>
