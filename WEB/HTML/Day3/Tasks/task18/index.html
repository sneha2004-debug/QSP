<!DOCTYPE html>
<html lang="en">
<head>
    <title>Multiple Iframe Dashboard</title>
</head>
<body>

    <h1>Multiple Iframe Dashboard</h1>

    <h2>YouTube Video</h2>
    <iframe
        width="700"
        height="400"
        src="https://www.youtube.com/embed/HcOc7P5BMi4"
        title="HTML Tutorial"
        allowfullscreen>
    </iframe>

    <hr>

    <h2>Google Map</h2>
    <iframe
        src="https://www.google.com/maps/embed?pb="
        width="700"
        height="400"
        title="Google Map">
    </iframe>

    <hr>

    <h2>Wikipedia Page</h2>
    <iframe
        src="https://en.wikipedia.org/wiki/HTML"
        width="700"
        height="400"
        title="Wikipedia HTML Page">
    </iframe>

</body>
</html>
